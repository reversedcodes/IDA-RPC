name: build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  plan:
    name: Read ida-plugin.json
    runs-on: ubuntu-latest
    outputs:
      ida_versions: ${{ steps.manifest.outputs.ida_versions }}
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_type == 'tag'
        run: |
          version=$(jq -r '.plugin.version' ida-plugin.json)
          tag=${GITHUB_REF_NAME#v}
          case "$version" in
            "$tag" | "$tag.0" | "$tag.0.0") ;;
            *)
              echo "::error::tag '$GITHUB_REF_NAME' does not match version '$version' in ida-plugin.json"
              exit 1
              ;;
          esac

      - id: manifest
        run: echo "ida_versions=$(jq -c '.plugin.idaVersions' ida-plugin.json)" >> "$GITHUB_OUTPUT"

  build:
    name: IDA ${{ matrix.ida }} (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        ida: ${{ fromJSON(needs.plan.outputs.ida_versions) }}
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: ida-discord-rpc.so
          - os: windows-latest
            platform: windows-x86_64
            binary: ida-discord-rpc.dll
          - os: macos-latest
            platform: macos-universal
            binary: ida-discord-rpc.dylib
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Check out the IDA SDK
        uses: actions/checkout@v4
        with:
          repository: HexRaysSA/ida-sdk
          ref: v${{ matrix.ida }}.0-release
          path: lib/ida-sdk

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - run: cmake --build build

      - if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-x64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-x64
          lipo -create \
            build/ida_plugins/${{ matrix.binary }} \
            build-x64/ida_plugins/${{ matrix.binary }} \
            -output universal.dylib
          mv universal.dylib build/ida_plugins/${{ matrix.binary }}
          archs=$(lipo -archs build/ida_plugins/${{ matrix.binary }})
          echo "universal dylib architectures: $archs"
          for want in arm64 x86_64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::missing $want slice in universal dylib"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ida-discord-rpc-${{ matrix.ida }}-${{ matrix.platform }}
          path: build/ida_plugins/${{ matrix.binary }}
          if-no-files-found: error

  package:
    name: Package release archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - run: bash .github/package.sh dist archives

      - run: pipx install ida-hcli

      - run: |
          for archive in archives/*.zip; do
            unzip -l "$archive"
            hcli plugin lint "$archive"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: archives/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: archives

      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*.zip
